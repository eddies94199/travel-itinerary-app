<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 美國行助手</title>
    
    <!-- PWA / App 圖示設定 -->
    <link rel="apple-touch-icon" href="icon.png?v=2">
    <link rel="icon" type="image/png" href="icon.png?v=2">
    
    <!-- 全螢幕 Web App 設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="2026 LA">
    <meta name="theme-color" content="#ffffff">
    
    <!-- 載入必要套件 (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        input, textarea { outline: none; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icon = ({ name, size = 16, strokeWidth = 2, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const INITIAL_ITINERARY = [
            {
                id: 'day-1', day: "Day 1", date: "2026/06/16 (二)", location: "Los Angeles",
                items: [
                    { id: 'item-1-1', time: "21:10", title: "Los Angeles International Airport (LAX)", type: "transport", desc: "辦理入境手續。", distMi: 0, durationMin: 0 },
                    { id: 'item-1-2', time: "晚上", title: "5527 Carlin St, Los Angeles", type: "spot", desc: "Airbnb 入住。", distMi: 12, durationMin: 25 }
                ]
            },
            {
                id: 'day-2', day: "Day 2", date: "2026/06/17 (三)", location: "Los Angeles",
                items: [
                    { id: 'item-2-1', time: "早上", title: "The Getty Center", type: "spot", desc: "美術館與花園。", distMi: 8, durationMin: 20 },
                    { id: 'item-2-3', time: "黃昏", title: "Griffith Observatory", type: "spot", desc: "看夜景。", distMi: 15, durationMin: 35 }
                ]
            }
        ];

        const INITIAL_PACKING = [
            { id: 1, text: "護照與 ESTA 授權書", checked: false },
            { id: 2, text: "國際駕照正本", checked: false },
        ];

        // API 呼叫輔助函式 (包含 Google Maps 自動查詢)
        async function fetchGoogleMapsData(prevTitle, currentTitle) {
            const apiKey = "";
            const systemPrompt = "你是一個旅遊導航專家。請根據 Google Maps 的數據，查詢兩個地點之間的開車距離（英里）和時間（分鐘）。請嚴格僅以 JSON 格式回覆，格式如下：{\"distMi\": 數字, \"durationMin\": 數字}。";
            const userQuery = `從「${prevTitle}」開車到「${currentTitle}」的距離和時間是多少？`;

            const callApi = async (retryCount = 0) => {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            tools: [{ "google_search": {} }],
                            generationConfig: { 
                                responseMimeType: "application/json",
                                responseSchema: {
                                    type: "OBJECT",
                                    properties: {
                                        distMi: { type: "NUMBER" },
                                        durationMin: { type: "NUMBER" }
                                    },
                                    required: ["distMi", "durationMin"]
                                }
                            }
                        })
                    });
                    if (!response.ok) throw new Error('API request failed');
                    const result = await response.json();
                    return JSON.parse(result.candidates?.[0]?.content?.parts?.[0]?.text);
                } catch (error) {
                    if (retryCount < 5) {
                        await new Promise(r => setTimeout(r, Math.pow(2, retryCount) * 1000));
                        return callApi(retryCount + 1);
                    }
                    throw error;
                }
            };
            return callApi();
        }

        function App() {
            const [activeTab, setActiveTab] = useState('itinerary');
            const [selectedDayIdx, setSelectedDayIdx] = useState(0);
            const [usdAmount, setUsdAmount] = useState('1');
            const [twdRate, setTwdRate] = useState(32.5);
            const [isSyncing, setIsSyncing] = useState(false);
            
            const [tripSettings, setTripSettings] = useState({
                topLabel: "2026 LA TRIP",
                itineraryTitle: "journey.",
                checklistTitle: "checklist.",
                utilitiesTitle: "utilities.",
                editorTitle: "settings.",
                daysLeftLabel: "Days Left"
            });

            const [itinerary, setItinerary] = useState(INITIAL_ITINERARY);
            const [packingList, setPackingList] = useState(INITIAL_PACKING);
            const [newPackingText, setNewPackingText] = useState("");
            const [weather, setWeather] = useState({ high: null, low: null, pop: null, status: 'loading' });

            const countdown = useMemo(() => {
                const target = new Date('2026-06-16T21:10:00').getTime();
                const diff = target - new Date().getTime();
                return Math.max(0, Math.floor(diff / (1000 * 60 * 60 * 24)));
            }, []);

            const dailyStats = useMemo(() => {
                const day = itinerary[selectedDayIdx];
                if (!day) return { dist: 0, time: 0 };
                return day.items.reduce((acc, item) => ({
                    dist: acc.dist + (Number(item.distMi) || 0),
                    time: acc.time + (Number(item.durationMin) || 0)
                }), { dist: 0, time: 0 });
            }, [selectedDayIdx, itinerary]);

            // --- 全自動背景 Google Maps 計算 ---
            useEffect(() => {
                const syncData = async () => {
                    const nextItinerary = JSON.parse(JSON.stringify(itinerary));
                    let hasGlobalChanged = false;

                    for (let dIdx = 0; dIdx < nextItinerary.length; dIdx++) {
                        const day = nextItinerary[dIdx];
                        for (let i = 0; i < day.items.length; i++) {
                            const item = day.items[i];
                            if (i > 0 && day.items[i-1].title && item.title) {
                                const currentKey = `${day.items[i-1].title}-${item.title}`;
                                if (item.lastGoogleKey !== currentKey && item.title.length > 3) {
                                    setIsSyncing(true);
                                    try {
                                        const data = await fetchGoogleMapsData(day.items[i-1].title, item.title);
                                        item.distMi = data.distMi;
                                        item.durationMin = data.durationMin;
                                        item.lastGoogleKey = currentKey;
                                        hasGlobalChanged = true;
                                    } catch (e) { console.error(e); }
                                }
                            }
                        }
                    }
                    if (hasGlobalChanged) setItinerary(nextItinerary);
                    setIsSyncing(false);
                };
                const timer = setTimeout(syncData, 3000);
                return () => clearTimeout(timer);
            }, [itinerary]);

            // --- 天氣自動抓取邏輯 (更新為扁平化佈局與最高/最低溫) ---
            useEffect(() => {
                const fetchWeather = async () => {
                    const day = itinerary[selectedDayIdx];
                    if (!day?.location) return;

                    const tripDateStr = day.date.split(' ')[0].replace(/\//g, '-');
                    const tripDate = new Date(tripDateStr);
                    const today = new Date();
                    const diffDays = Math.ceil((tripDate.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));

                    if (diffDays > 14) {
                        setWeather({ high: null, low: null, pop: null, status: 'upcoming' });
                        return;
                    }

                    setWeather(prev => ({ ...prev, status: 'loading' }));
                    try {
                        const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(day.location)}&limit=1`);
                        const geoData = await geoRes.json();
                        if (geoData && geoData[0]) {
                            const { lat, lon } = geoData[0];
                            const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`);
                            const weatherData = await weatherRes.json();
                            setWeather({
                                high: Math.round(weatherData.daily.temperature_2m_max[0]),
                                low: Math.round(weatherData.daily.temperature_2m_min[0]),
                                pop: `${weatherData.daily.precipitation_probability_max[0]}%`,
                                status: 'ready'
                            });
                        }
                    } catch (e) {
                        setWeather(prev => ({ ...prev, status: 'error' }));
                    }
                };
                fetchWeather();
            }, [selectedDayIdx, itinerary[selectedDayIdx]?.location]);

            const updateDay = (idx, field, val) => {
                const next = [...itinerary];
                next[idx] = { ...next[idx], [field]: val };
                setItinerary(next);
            };

            const updateItem = (dIdx, iIdx, field, val) => {
                const next = [...itinerary];
                next[dIdx].items[iIdx] = { ...next[dIdx].items[iIdx], [field]: val };
                setItinerary(next);
            };

            const addItem = (dIdx) => {
                const next = [...itinerary];
                next[dIdx].items.push({ id: Date.now(), time: "12:00", title: "", desc: "", distMi: 0, durationMin: 0 });
                setItinerary(next);
            };

            const deleteItem = (dIdx, iIdx) => {
                const next = [...itinerary];
                next[dIdx].items.splice(iIdx, 1);
                setItinerary(next);
            };

            const addDay = () => {
                const nextNum = itinerary.length + 1;
                setItinerary([...itinerary, { id: Date.now(), day: `Day ${nextNum}`, date: "2026/06/--", location: "Los Angeles", items: [] }]);
            };

            const togglePacking = (id) => setPackingList(prev => prev.map(item => item.id === id ? { ...item, checked: !item.checked } : item));
            const addPackingItem = (e) => {
                if (e) e.preventDefault();
                if (!newPackingText.trim()) return;
                setPackingList([...packingList, { id: Date.now(), text: newPackingText, checked: false }]);
                setNewPackingText("");
            };
            const deletePackingItem = (id) => setPackingList(packingList.filter(item => item.id !== id));

            return (
                <div className="flex flex-col h-screen max-w-md mx-auto bg-white shadow-2xl overflow-hidden relative text-black">
                    {/* Header */}
                    <header className="px-8 pt-10 pb-6 z-10 bg-white border-b border-slate-50">
                        <div className="flex justify-between items-start mb-2">
                            <p className="text-[9px] font-black tracking-[0.3em] text-slate-300 uppercase leading-none">{tripSettings.topLabel}</p>
                            <div className="flex items-center gap-1.5 px-2 py-0.5 bg-indigo-50 rounded-full border border-indigo-100">
                                <div className={`w-1.5 h-1.5 rounded-full ${isSyncing ? 'bg-amber-400 animate-pulse' : 'bg-emerald-500'}`}></div>
                                <span className="text-[8px] font-black text-slate-500 uppercase tracking-tighter">{isSyncing ? 'Google Syncing...' : 'Google Maps Active'}</span>
                            </div>
                        </div>
                        <div className="flex justify-between items-end">
                            <h1 className="text-3xl font-black tracking-tighter text-black leading-none">
                                {activeTab === 'itinerary' && tripSettings.itineraryTitle}
                                {activeTab === 'packing' && tripSettings.checklistTitle}
                                {activeTab === 'tools' && tripSettings.utilitiesTitle}
                                {activeTab === 'edit' && tripSettings.editorTitle}
                            </h1>
                            <div className="text-right">
                                <p className="text-2xl font-black tracking-tighter text-black leading-none">{countdown}</p>
                                <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">{tripSettings.daysLeftLabel}</p>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 overflow-y-auto no-scrollbar pb-36 px-8">
                        {activeTab === 'itinerary' && (
                            <div className="space-y-6 animate-fade-in pt-6">
                                <div className="flex space-x-2 overflow-x-auto py-1 no-scrollbar">
                                    {itinerary.map((day, idx) => (
                                        <button key={day.id} onClick={() => setSelectedDayIdx(idx)} className={`flex-shrink-0 px-4 py-2 rounded-xl transition-all border ${selectedDayIdx === idx ? 'bg-black border-black text-white shadow-lg' : 'bg-white border-slate-100 text-slate-400'}`}>
                                            <p className="text-[8px] font-black uppercase tracking-widest mb-0.5">{day.day}</p>
                                            <p className="text-xs font-bold">{day.date.split('/')[2]?.split(' ')[0]}</p>
                                        </button>
                                    ))}
                                </div>

                                {/* 扁平化天氣區塊 */}
                                <div className="bg-slate-50 rounded-2xl px-6 py-4 border border-slate-100 flex items-center justify-between">
                                    <div className="flex items-center gap-6">
                                        <div className="flex items-center gap-2">
                                            <Icon name="map-pin" size={12} className="text-slate-300" />
                                            <span className="text-[10px] font-black uppercase tracking-widest text-slate-400">{itinerary[selectedDayIdx].location}</span>
                                        </div>
                                        
                                        {weather.status === 'upcoming' ? (
                                            <span className="text-xs font-bold text-slate-300 italic">尚未公佈預報</span>
                                        ) : weather.status === 'ready' ? (
                                            <div className="flex items-center gap-5">
                                                <div className="flex items-baseline gap-1">
                                                    <span className="text-lg font-black tracking-tighter">{weather.high}°</span>
                                                    <span className="text-[10px] font-bold text-slate-300">/</span>
                                                    <span className="text-sm font-bold text-slate-400 tracking-tighter">{weather.low}°</span>
                                                </div>
                                                <div className="flex items-center gap-1.5">
                                                    <Icon name="droplets" size={11} className="text-blue-400" />
                                                    <span className="text-xs font-black text-blue-500 tracking-tighter">{weather.pop}</span>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="w-20 h-4 bg-slate-200 animate-pulse rounded"></div>
                                        )}
                                    </div>
                                    
                                    <div className="flex items-center justify-center">
                                        {weather.status === 'ready' ? (
                                            <Icon 
                                                name={parseInt(weather.pop) > 30 ? 'cloud-rain' : 'sun'} 
                                                size={22} 
                                                className={parseInt(weather.pop) > 30 ? 'text-blue-400' : 'text-amber-400'} 
                                            />
                                        ) : <div className="w-5 h-5 bg-slate-200 rounded-full"></div>}
                                    </div>
                                </div>

                                {/* 統計數據區塊 */}
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="bg-slate-50 rounded-2xl p-4 border border-slate-100"><div className="flex items-center gap-2 mb-1"><Icon name="clock" size={12} className="text-indigo-400" /><span className="text-[9px] font-black text-slate-400 uppercase tracking-widest">總車程</span></div><p className="text-lg font-black tracking-tighter text-black">{dailyStats.time >= 60 ? `${Math.floor(dailyStats.time / 60)}h ${dailyStats.time % 60}m` : `${dailyStats.time}m`}</p></div>
                                    <div className="bg-slate-50 rounded-2xl p-4 border border-slate-100"><div className="flex items-center gap-2 mb-1"><Icon name="navigation" size={12} className="text-emerald-400" /><span className="text-[9px] font-black text-slate-400 uppercase tracking-widest">總距離</span></div><p className="text-lg font-black tracking-tighter text-black">{dailyStats.dist} mi</p></div>
                                </div>

                                {/* 行程清單 */}
                                <div className="space-y-10 pt-4 border-t border-slate-50">
                                    {itinerary[selectedDayIdx]?.items.map((item, idx) => (
                                        <div key={item.id} className="relative group animate-fade-in" style={{ animationDelay: `${idx * 0.1}s` }}><div className="flex items-start gap-5"><div className="pt-1 min-w-[45px]"><span className="text-[8px] font-black text-slate-200 uppercase block mb-1">Time</span><span className="text-xs font-bold text-black">{item.time}</span></div><div className="flex-1"><div className="flex items-center gap-2 mb-2">{item.distMi > 0 && <span className="text-[9px] font-bold text-slate-300 flex items-center gap-1"><Icon name="car" size={10} /> +{item.distMi} mi ({item.durationMin}m)</span>}</div><h4 className="text-lg font-extrabold tracking-tight mb-1 text-black leading-tight">{item.title || "未設定地點"}</h4><p className="text-xs text-slate-500 font-medium leading-relaxed mb-4">{item.desc}</p></div></div></div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'packing' && (
                            <div className="space-y-6 animate-fade-in pt-6">
                                <div className="p-8 bg-black rounded-[2.5rem] text-white flex justify-between items-center shadow-2xl">
                                    <div><p className="text-[9px] font-black uppercase tracking-widest text-slate-500 mb-1">Progress</p><h3 className="text-2xl font-bold tracking-tighter italic uppercase">{tripSettings.checklistTitle}</h3></div><div className="text-3xl font-black italic">{Math.round((packingList.filter(i => i.checked).length / Math.max(1, packingList.length)) * 100)}%</div>
                                </div>
                                <div className="space-y-3">
                                    {packingList.map(item => (
                                        <div key={item.id} className="group relative flex items-center gap-4">
                                            <button onClick={() => togglePacking(item.id)} className={`flex-1 flex items-center gap-5 p-5 rounded-[1.5rem] border transition-all ${item.checked ? 'bg-slate-50 border-transparent opacity-60' : 'bg-white border-slate-100 shadow-sm'}`}>
                                                <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all ${item.checked ? 'bg-emerald-500 border-emerald-500 text-white shadow-lg' : 'border-slate-200'}`}>{item.checked && <Icon name="check" size={12} strokeWidth={4} />}</div>
                                                <span className={`text-sm font-bold text-left flex-1 ${item.checked ? 'text-slate-300 line-through' : 'text-slate-900'}`}>{item.text}</span>
                                            </button>
                                            <button onClick={() => deletePackingItem(item.id)} className="p-3 text-slate-200 hover:text-rose-500 transition-colors"><Icon name="trash-2" size={16} /></button>
                                        </div>
                                    ))}
                                </div>
                                <form onSubmit={addPackingItem} className="mt-8 flex gap-2 p-1 bg-white border border-slate-100 rounded-2xl shadow-sm focus-within:border-indigo-200 transition-colors">
                                    <input type="text" value={newPackingText} onChange={(e) => setNewPackingText(e.target.value)} placeholder="Add to list..." className="flex-1 px-5 py-3 text-sm font-medium placeholder:text-slate-300"/>
                                    <button type="submit" className="w-11 h-11 bg-black text-white rounded-xl flex items-center justify-center hover:bg-slate-800 active:scale-95"><Icon name="plus" size={18} /></button>
                                </form>
                            </div>
                        )}

                        {activeTab === 'tools' && (
                            <div className="space-y-8 animate-fade-in pt-6">
                                <div className="bg-slate-50 rounded-[2.5rem] p-10 space-y-10 border border-slate-100">
                                    <div><p className="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6 uppercase">{tripSettings.utilitiesTitle}</p><div className="flex items-baseline gap-3"><span className="text-2xl font-black text-slate-300">$</span><input type="number" value={usdAmount} onChange={e => setUsdAmount(e.target.value)} className="w-full bg-transparent border-none text-6xl font-black tracking-tighter focus:ring-0 p-0 text-black outline-none" /></div></div>
                                    <div className="flex items-center gap-4 opacity-20"><div className="h-[1px] flex-1 bg-slate-900"></div><Icon name="chevron-down" /><div className="h-[1px] flex-1 bg-slate-900"></div></div>
                                    <div className="text-right"><p className="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">TWD Estimate</p><span className="text-2xl font-black text-slate-200 mr-3">NT$</span><span className="text-6xl font-black tracking-tighter text-black">{(usdAmount * twdRate).toLocaleString(undefined, {maximumFractionDigits: 0})}</span></div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'edit' && (
                            <div className="space-y-10 animate-fade-in pt-6 pb-10">
                                <section className="space-y-4">
                                    <div className="flex items-center gap-2 border-b pb-2 text-indigo-500">
                                        <Icon name="layout" size={14}/>
                                        <h3 className="text-[10px] font-black uppercase tracking-widest">Header Settings</h3>
                                    </div>
                                    <div className="grid gap-3">
                                        <div className="space-y-1">
                                            <span className="text-[8px] font-bold text-slate-400 uppercase tracking-widest">Top Label</span>
                                            <input value={tripSettings.topLabel} onChange={e => setTripSettings({...tripSettings, topLabel: e.target.value})} className="w-full bg-slate-50 rounded-xl p-3 text-xs font-bold border-none" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="space-y-1">
                                                <span className="text-[8px] font-bold text-slate-400 uppercase tracking-widest">Itinerary Tab</span>
                                                <input value={tripSettings.itineraryTitle} onChange={e => setTripSettings({...tripSettings, itineraryTitle: e.target.value})} className="w-full bg-slate-50 rounded-xl p-3 text-xs font-bold border-none" />
                                            </div>
                                            <div className="space-y-1">
                                                <span className="text-[8px] font-bold text-slate-400 uppercase tracking-widest">Checklist Tab</span>
                                                <input value={tripSettings.checklistTitle} onChange={e => setTripSettings({...tripSettings, checklistTitle: e.target.value})} className="w-full bg-slate-50 rounded-xl p-3 text-xs font-bold border-none" />
                                            </div>
                                        </div>
                                    </div>
                                </section>

                                <section className="space-y-6">
                                    <div className="flex items-center justify-between border-b pb-2 text-indigo-500">
                                        <div className="flex items-center gap-2">
                                            <Icon name="edit-3" size={14}/>
                                            <h3 className="text-[10px] font-black uppercase tracking-widest">Manage Data</h3>
                                        </div>
                                        <button onClick={addDay} className="text-[10px] font-black uppercase">+ Add Day</button>
                                    </div>
                                    {itinerary.map((day, dIdx) => (
                                        <div key={day.id} className="bg-white border rounded-3xl p-6 space-y-4 shadow-sm relative text-black">
                                            <div className="flex gap-2">
                                                <input value={day.day} onChange={e => updateDay(dIdx, 'day', e.target.value)} className="w-20 bg-slate-50 p-2 rounded-lg text-xs font-black border-none uppercase"/>
                                                <input value={day.location} onChange={e => updateDay(dIdx, 'location', e.target.value)} className="flex-1 bg-slate-50 p-2 rounded-lg text-xs font-black border-none" placeholder="City Name (for Weather)"/>
                                            </div>
                                            <input value={day.date} onChange={e => updateDay(dIdx, 'date', e.target.value)} className="w-full text-base font-bold border-b p-1 border-slate-100" placeholder="YYYY/MM/DD (週)"/>
                                            
                                            <div className="space-y-4 pt-4">
                                                {day.items.map((item, iIdx) => (
                                                    <div key={item.id} className="p-4 bg-slate-50 rounded-2xl relative group space-y-3">
                                                        <div className="flex gap-2">
                                                            <input value={item.time} onChange={e => updateItem(dIdx, iIdx, 'time', e.target.value)} className="w-16 bg-white p-2 rounded-lg text-xs font-bold border border-slate-100"/>
                                                            <input value={item.title} onChange={e => updateItem(dIdx, iIdx, 'title', e.target.value)} className="flex-1 bg-white p-2 rounded-lg text-xs font-bold border border-slate-100" placeholder="Google Maps Location Name"/>
                                                        </div>
                                                        <textarea value={item.desc} onChange={e => updateItem(dIdx, iIdx, 'desc', e.target.value)} className="w-full bg-white p-3 rounded-lg text-xs border border-slate-100 h-16 resize-none" placeholder="Notes..."/>
                                                        <div className="grid grid-cols-2 gap-2 text-slate-400">
                                                            <div className="flex items-center gap-2 bg-white px-3 py-2 rounded-lg border border-slate-100">
                                                                <Icon name="car" size={12}/>
                                                                <input type="number" readOnly value={item.distMi} className="w-full bg-transparent border-none p-0 focus:ring-0 text-xs font-bold" placeholder="Auto Mi"/>
                                                            </div>
                                                            <div className="flex items-center gap-2 bg-white px-3 py-2 rounded-lg border border-slate-100">
                                                                <Icon name="clock" size={12}/>
                                                                <input type="number" readOnly value={item.durationMin} className="w-full bg-transparent border-none p-0 focus:ring-0 text-xs font-bold" placeholder="Auto Min"/>
                                                            </div>
                                                        </div>
                                                        <button onClick={() => deleteItem(dIdx, iIdx)} className="absolute -top-2 -right-2 bg-white border rounded-full w-6 h-6 flex items-center justify-center text-rose-500 shadow-sm opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="x" size={12}/></button>
                                                    </div>
                                                ))}
                                                <button onClick={() => addItem(dIdx)} className="w-full py-4 border-2 border-dashed border-slate-100 rounded-2xl text-[10px] font-black text-slate-300 uppercase tracking-widest hover:text-indigo-500 hover:border-indigo-200 transition-all">+ Add Item</button>
                                            </div>
                                        </div>
                                    ))}
                                </section>
                            </div>
                        )}
                    </main>

                    {/* Nav Bar */}
                    <nav className="fixed bottom-10 left-1/2 -translate-x-1/2 bg-white/80 backdrop-blur-2xl shadow-2xl rounded-[2.5rem] flex items-center px-3 py-3 gap-1 z-50 border border-slate-100">
                        {[
                            { id: 'itinerary', icon: 'calendar', label: "行程" },
                            { id: 'packing', icon: 'briefcase', label: "清單" },
                            { id: 'tools', icon: 'calculator', label: "工具" },
                            { id: 'edit', icon: 'settings', label: "設定" },
                        ].map((tab) => (
                            <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-2 px-5 py-3 rounded-full transition-all duration-500 ${activeTab === tab.id ? 'bg-black text-white shadow-xl scale-105' : 'text-slate-300 hover:text-slate-600'}`}>
                                <Icon name={tab.icon} size={16} strokeWidth={activeTab === tab.id ? 2.5 : 2} />
                                {activeTab === tab.id && <span className="text-[10px] font-black tracking-tighter">{tab.label}</span>}
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
