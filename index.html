<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 美國行助手</title>
    
    <!-- PWA / App 圖示設定 -->
    <link rel="apple-touch-icon" href="icon.png?v=2">
    <link rel="icon" type="image/png" href="icon.png?v=2">
    
    <!-- 全螢幕 Web App 設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="2026 LA">
    <meta name="theme-color" content="#ffffff">
    
    <!-- 載入必要套件 (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        input, textarea { outline: none; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icon = ({ name, size = 16, strokeWidth = 2, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const INITIAL_ITINERARY = [
            {
                id: 'day-1', day: "Day 1", date: "2026/06/16 (二)", location: "Los Angeles", coords: { lat: 34.0522, lng: -118.2437 },
                items: [
                    { id: 'item-1-1', time: "21:10", title: "Los Angeles International Airport", type: "transport", desc: "辦理入境手續。", coords: { lat: 33.9416, lng: -118.4085 } },
                    { id: 'item-1-2', time: "晚上", title: "5527 Carlin St, Los Angeles", type: "spot", desc: "Airbnb 入住。", coords: { lat: 34.0312, lng: -118.3582 }, distMi: 12, durationMin: 25 }
                ]
            },
            {
                id: 'day-2', day: "Day 2", date: "2026/06/17 (三)", location: "Los Angeles", coords: { lat: 34.0522, lng: -118.2437 },
                items: [
                    { id: 'item-2-1', time: "早上", title: "The Getty", type: "spot", desc: "美術館與花園。", coords: { lat: 34.0780, lng: -118.4741 }, distMi: 8, durationMin: 20 },
                    { id: 'item-2-3', time: "黃昏", title: "Griffith Observatory", type: "spot", desc: "看夜景。", coords: { lat: 34.1184, lng: -118.3004 }, distMi: 15, durationMin: 35 }
                ]
            }
        ];

        const INITIAL_PACKING = [
            { id: 1, text: "護照與 ESTA 授權書", checked: false },
            { id: 2, text: "國際駕照正本", checked: false },
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('itinerary');
            const [selectedDayIdx, setSelectedDayIdx] = useState(0);
            const [usdAmount, setUsdAmount] = useState('1');
            const [twdRate, setTwdRate] = useState(32.5);
            const [isSyncing, setIsSyncing] = useState(false);
            
            // 預設全小寫標題
            const [tripSettings, setTripSettings] = useState({
                topLabel: "2026 LA TRIP",
                itineraryTitle: "journey.",
                checklistTitle: "checklist.",
                utilitiesTitle: "utilities.",
                editorTitle: "settings.",
                daysLeftLabel: "Days Left"
            });

            const [itinerary, setItinerary] = useState(INITIAL_ITINERARY);
            const [packingList, setPackingList] = useState(INITIAL_PACKING);
            const [newPackingText, setNewPackingText] = useState("");
            const [weather, setWeather] = useState({ temp: null, pop: null, status: 'loading' });

            const countdown = useMemo(() => {
                const target = new Date('2026-06-16T21:10:00').getTime();
                const diff = target - new Date().getTime();
                return Math.max(0, Math.floor(diff / (1000 * 60 * 60 * 24)));
            }, []);

            const dailyStats = useMemo(() => {
                const day = itinerary[selectedDayIdx];
                if (!day) return { dist: 0, time: 0 };
                return day.items.reduce((acc, item) => ({
                    dist: acc.dist + (Number(item.distMi) || 0),
                    time: acc.time + (Number(item.durationMin) || 0)
                }), { dist: 0, time: 0 });
            }, [selectedDayIdx, itinerary]);

            // --- 全自動背景計算邏輯 (套用於所有天數) ---
            useEffect(() => {
                const timer = setTimeout(async () => {
                    const nextItinerary = JSON.parse(JSON.stringify(itinerary)); // 深拷貝
                    let globalChanged = false;

                    setIsSyncing(true);

                    // 遍歷所有天數
                    for (let dIdx = 0; dIdx < nextItinerary.length; dIdx++) {
                        const day = nextItinerary[dIdx];
                        let dayChanged = false;

                        for (let i = 0; i < day.items.length; i++) {
                            const item = day.items[i];
                            
                            // 1. 背景地點搜尋 (Geocoding)
                            if (item.title && item.title.length > 2 && item.title !== item.lastSearchedTitle) {
                                try {
                                    const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(item.title)}&limit=1`);
                                    const geoData = await geoRes.json();
                                    if (geoData && geoData[0]) {
                                        item.coords = { lat: parseFloat(geoData[0].lat), lng: parseFloat(geoData[0].lon) };
                                        item.lastSearchedTitle = item.title;
                                        dayChanged = true;
                                        globalChanged = true;
                                    }
                                } catch (e) { console.error("Geocoding failed", e); }
                                await new Promise(r => setTimeout(r, 100)); // 避免請求過快
                            }

                            // 2. 背景路徑計算 (Routing)
                            // 計算與該天前一個地點的距離
                            if (i > 0 && day.items[i-1].coords && item.coords) {
                                const prev = day.items[i-1];
                                const coordKey = `${prev.coords.lat},${prev.coords.lng}-${item.coords.lat},${item.coords.lng}`;
                                
                                if (item.lastRouteKey !== coordKey) {
                                    try {
                                        const routeRes = await fetch(`https://router.project-osrm.org/route/v1/driving/${prev.coords.lng},${prev.coords.lat};${item.coords.lng},${item.coords.lat}?overview=false`);
                                        const routeData = await routeRes.json();
                                        if (routeData.routes && routeData.routes[0]) {
                                            const route = routeData.routes[0];
                                            item.distMi = Math.round((route.distance / 1609.34) * 10) / 10;
                                            item.durationMin = Math.round(route.duration / 60);
                                            item.lastRouteKey = coordKey;
                                            dayChanged = true;
                                            globalChanged = true;
                                        }
                                    } catch (e) { console.error("Routing failed", e); }
                                    await new Promise(r => setTimeout(r, 100));
                                }
                            } else if (i === 0) {
                                // 如果是當天第一個點，清空車程數據
                                if (item.distMi !== 0 || item.durationMin !== 0) {
                                    item.distMi = 0;
                                    item.durationMin = 0;
                                    dayChanged = true;
                                    globalChanged = true;
                                }
                            }
                        }
                    }

                    if (globalChanged) {
                        setItinerary(nextItinerary);
                    }
                    setIsSyncing(false);
                }, 1500); // 停止輸入 1.5 秒後執行全域同步

                return () => clearTimeout(timer);
            }, [itinerary]);

            const updateDay = (idx, field, val) => {
                const next = [...itinerary];
                next[idx] = { ...next[idx], [field]: val };
                setItinerary(next);
            };

            const updateItem = (dIdx, iIdx, field, val) => {
                const next = [...itinerary];
                next[dIdx].items[iIdx] = { ...next[dIdx].items[iIdx], [field]: val };
                setItinerary(next);
            };

            const addItem = (dIdx) => {
                const next = [...itinerary];
                next[dIdx].items.push({ id: Date.now(), time: "12:00", title: "", desc: "", distMi: 0, durationMin: 0, type: 'spot' });
                setItinerary(next);
            };

            const deleteItem = (dIdx, iIdx) => {
                const next = [...itinerary];
                next[dIdx].items.splice(iIdx, 1);
                setItinerary(next);
            };

            const addDay = () => {
                const nextNum = itinerary.length + 1;
                setItinerary([...itinerary, { id: Date.now(), day: `Day ${nextNum}`, date: "2026/06/--", location: "New City", coords: null, items: [] }]);
            };

            const togglePacking = (id) => setPackingList(prev => prev.map(item => item.id === id ? { ...item, checked: !item.checked } : item));
            
            const addPackingItem = (e) => {
                if (e) e.preventDefault();
                if (!newPackingText.trim()) return;
                setPackingList([...packingList, { id: Date.now(), text: newPackingText, checked: false }]);
                setNewPackingText("");
            };

            const deletePackingItem = (id) => setPackingList(packingList.filter(item => item.id !== id));

            const generateRouteUrl = () => {
                const day = itinerary[selectedDayIdx];
                if (!day) return "#";
                const locs = day.items.filter(i => i.coords).map(i => `${i.coords.lat},${i.coords.lng}`);
                if (locs.length < 2) return day.items[0]?.mapUrl || "#";
                return `https://www.google.com/maps/dir/?api=1&origin=${locs[0]}&destination=${locs[locs.length - 1]}&waypoints=${locs.slice(1, -1).join('|')}&travelmode=driving`;
            };

            useEffect(() => {
                const fetchWeather = async () => {
                    const day = itinerary[selectedDayIdx];
                    if (!day?.coords) return;
                    const tripDate = new Date(day.date.split(' ')[0].replace(/\//g, '-'));
                    const diffDays = Math.ceil((tripDate.getTime() - new Date().getTime()) / (1000 * 60 * 60 * 24));
                    if (diffDays > 14) { setWeather({ temp: null, pop: null, status: 'upcoming' }); return; }
                    setWeather({ status: 'loading' });
                    try {
                        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${day.coords.lat}&longitude=${day.coords.lng}&current=temperature_2m,weather_code&hourly=precipitation_probability&timezone=auto`);
                        const data = await res.json();
                        setWeather({ temp: `${Math.round(data.current.temperature_2m)}°C`, pop: `${data.hourly.precipitation_probability[0]}%`, status: 'ready' });
                    } catch (e) { setWeather({ status: 'error' }); }
                };
                fetchWeather();
            }, [selectedDayIdx]);

            return (
                <div className="flex flex-col h-screen max-w-md mx-auto bg-white shadow-2xl overflow-hidden relative">
                    {/* Header */}
                    <header className="px-8 pt-10 pb-6 z-10 bg-white border-b border-slate-50">
                        <div className="flex justify-between items-start mb-2">
                            <p className="text-[9px] font-black tracking-[0.3em] text-slate-300 uppercase leading-none">{tripSettings.topLabel}</p>
                            <div className="flex items-center gap-1 px-2 py-0.5 bg-indigo-50 rounded-full border border-indigo-100">
                                <div className={`w-1.5 h-1.5 rounded-full ${isSyncing ? 'bg-amber-400 animate-pulse' : 'bg-emerald-500'}`}></div>
                                <span className="text-[8px] font-black text-slate-500 uppercase tracking-tighter">{isSyncing ? 'Syncing...' : 'Updated'}</span>
                            </div>
                        </div>
                        <div className="flex justify-between items-end">
                            <h1 className="text-3xl font-black tracking-tighter text-black leading-none">
                                {activeTab === 'itinerary' && tripSettings.itineraryTitle}
                                {activeTab === 'packing' && tripSettings.checklistTitle}
                                {activeTab === 'tools' && tripSettings.utilitiesTitle}
                                {activeTab === 'edit' && tripSettings.editorTitle}
                            </h1>
                            <div className="text-right">
                                <p className="text-2xl font-black tracking-tighter text-black leading-none">{countdown}</p>
                                <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">{tripSettings.daysLeftLabel}</p>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 overflow-y-auto no-scrollbar pb-36 px-8">
                        {activeTab === 'itinerary' && (
                            <div className="space-y-6 animate-fade-in pt-6">
                                <div className="flex space-x-2 overflow-x-auto py-1 no-scrollbar">
                                    {itinerary.map((day, idx) => (
                                        <button key={day.id} onClick={() => setSelectedDayIdx(idx)} className={`flex-shrink-0 px-4 py-2 rounded-xl transition-all border ${selectedDayIdx === idx ? 'bg-black border-black text-white shadow-lg' : 'bg-white border-slate-100 text-slate-400'}`}>
                                            <p className="text-[8px] font-black uppercase tracking-widest mb-0.5">{day.day}</p>
                                            <p className="text-xs font-bold">{day.date.split('/')[2]?.split(' ')[0]}</p>
                                        </button>
                                    ))}
                                </div>
                                <div className="space-y-3">
                                    <div className="bg-slate-50 rounded-[2rem] p-7 border border-slate-100">
                                        <div className="flex justify-between items-start">
                                            <div className="flex-1">
                                                <div className="flex items-center gap-1.5 mb-2"><Icon name="map-pin" size={10} className="text-slate-400" /><p className="text-[9px] font-black uppercase tracking-widest text-slate-400">{itinerary[selectedDayIdx].location}</p></div>
                                                {weather.status === 'upcoming' ? <h3 className="text-xl font-black text-slate-300 tracking-tight">尚未公佈預報</h3> : <div className="flex items-center gap-4"><h3 className="text-4xl font-black tracking-tighter">{weather.temp || '--'}</h3><div className="h-8 w-[1px] bg-slate-200"></div><div><div className="flex items-center gap-1 text-blue-500 font-black"><Icon name="droplets" size={12} /><span className="text-xs">{weather.pop || '--'}</span></div><p className="text-[8px] font-bold text-slate-400 uppercase tracking-tighter">降雨機率</p></div></div>}
                                            </div>
                                            <Icon name="sun" size={32} className="text-amber-400" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="bg-slate-50 rounded-2xl p-4 border border-slate-100"><div className="flex items-center gap-2 mb-1"><Icon name="clock" size={12} className="text-indigo-400" /><span className="text-[9px] font-black text-slate-400 uppercase tracking-widest">總車程</span></div><p className="text-lg font-black tracking-tighter">{dailyStats.time >= 60 ? `${Math.floor(dailyStats.time / 60)}h ${dailyStats.time % 60}m` : `${dailyStats.time}m`}</p></div>
                                        <div className="bg-slate-50 rounded-2xl p-4 border border-slate-100"><div className="flex items-center gap-2 mb-1"><Icon name="navigation" size={12} className="text-emerald-400" /><span className="text-[9px] font-black text-slate-400 uppercase tracking-widest">總距離</span></div><p className="text-lg font-black tracking-tighter">{dailyStats.dist} mi</p></div>
                                    </div>
                                    <a href={generateRouteUrl()} target="_blank" className="flex items-center justify-between w-full bg-black text-white p-5 rounded-2xl active:scale-95 transition-transform shadow-xl"><div className="flex items-center gap-3"><div className="p-2 bg-white/10 rounded-lg"><Icon name="map" size={18} /></div><div><p className="text-[10px] font-black uppercase tracking-[0.1em] opacity-60">今日路線規劃圖</p><p className="text-sm font-bold tracking-tight">自動串聯導航路徑</p></div></div><Icon name="chevron-right" size={18} className="opacity-40" /></a>
                                </div>
                                <div className="space-y-10 pt-4 border-t border-slate-50">
                                    {itinerary[selectedDayIdx]?.items.map((item, idx) => (
                                        <div key={item.id} className="relative group animate-fade-in" style={{ animationDelay: `${idx * 0.1}s` }}><div className="flex items-start gap-5"><div className="pt-1 min-w-[45px]"><span className="text-[8px] font-black text-slate-200 uppercase block mb-1">Time</span><span className="text-xs font-bold text-black">{item.time}</span></div><div className="flex-1"><div className="flex items-center gap-2 mb-2">{item.type === 'match' && <span className="px-2 py-0.5 bg-amber-50 text-amber-600 text-[8px] font-black rounded-full uppercase border border-amber-100">Big Match</span>}{item.distMi > 0 && <span className="text-[9px] font-bold text-slate-300 flex items-center gap-1"><Icon name="car" size={10} /> +{item.distMi} mi</span>}</div><h4 className="text-lg font-extrabold tracking-tight mb-1 text-black leading-tight">{item.title}</h4><p className="text-xs text-slate-500 font-medium leading-relaxed mb-4">{item.desc}</p>{item.coords && <button onClick={() => window.open(`https://www.google.com/maps/search/?api=1&query=${item.coords.lat},${item.coords.lng}`)} className="flex items-center gap-2 text-[10px] font-bold text-slate-400 hover:text-black"><Icon name="map-pin" size={10} /> View Detail</button>}</div></div></div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'packing' && (
                            <div className="space-y-6 animate-fade-in pt-6">
                                <div className="p-8 bg-black rounded-[2.5rem] text-white flex justify-between items-center shadow-2xl">
                                    <div><p className="text-[9px] font-black uppercase tracking-widest text-slate-500 mb-1">Progress</p><h3 className="text-2xl font-bold tracking-tighter italic uppercase">{tripSettings.checklistTitle}</h3></div><div className="text-3xl font-black italic">{Math.round((packingList.filter(i => i.checked).length / Math.max(1, packingList.length)) * 100)}%</div>
                                </div>
                                <div className="space-y-3">
                                    {packingList.map(item => (
                                        <div key={item.id} className="group relative flex items-center gap-4">
                                            <button onClick={() => togglePacking(item.id)} className={`flex-1 flex items-center gap-5 p-5 rounded-[1.5rem] border transition-all ${item.checked ? 'bg-slate-50 border-transparent opacity-60' : 'bg-white border-slate-100 shadow-sm'}`}>
                                                <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all ${item.checked ? 'bg-emerald-500 border-emerald-500 text-white shadow-lg' : 'border-slate-200'}`}>{item.checked && <Icon name="check" size={12} strokeWidth={4} />}</div>
                                                <span className={`text-sm font-bold text-left flex-1 ${item.checked ? 'text-slate-300 line-through' : 'text-slate-900'}`}>{item.text}</span>
                                            </button>
                                            <button onClick={() => deletePackingItem(item.id)} className="p-3 text-slate-200 hover:text-rose-500 transition-colors"><Icon name="trash-2" size={16} /></button>
                                        </div>
                                    ))}
                                </div>
                                <form onSubmit={addPackingItem} className="mt-8 flex gap-2 p-1 bg-white border border-slate-100 rounded-2xl shadow-sm focus-within:border-indigo-200 transition-colors">
                                    <input type="text" value={newPackingText} onChange={(e) => setNewPackingText(e.target.value)} placeholder="Add something to pack..." className="flex-1 px-5 py-3 text-sm font-medium placeholder:text-slate-300"/>
                                    <button type="submit" className="w-11 h-11 bg-black text-white rounded-xl flex items-center justify-center hover:bg-slate-800 active:scale-95"><Icon name="plus" size={18} /></button>
                                </form>
                            </div>
                        )}

                        {activeTab === 'tools' && (
                            <div className="space-y-8 animate-fade-in pt-6">
                                <div className="bg-slate-50 rounded-[2.5rem] p-10 space-y-10 border border-slate-100">
                                    <div><p className="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6 uppercase">{tripSettings.utilitiesTitle}</p><div className="flex items-baseline gap-3"><span className="text-2xl font-black text-slate-300">$</span><input type="number" value={usdAmount} onChange={e => setUsdAmount(e.target.value)} className="w-full bg-transparent border-none text-6xl font-black tracking-tighter focus:ring-0 p-0 text-black outline-none" /></div></div>
                                    <div className="flex items-center gap-4 opacity-20"><div className="h-[1px] flex-1 bg-slate-900"></div><Icon name="chevron-down" /><div className="h-[1px] flex-1 bg-slate-900"></div></div>
                                    <div className="text-right"><p className="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">TWD Estimate</p><span className="text-2xl font-black text-slate-200 mr-3">NT$</span><span className="text-6xl font-black tracking-tighter text-black">{(usdAmount * twdRate).toLocaleString(undefined, {maximumFractionDigits: 0})}</span></div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'edit' && (
                            <div className="space-y-10 animate-fade-in pt-6 pb-10">
                                <section className="space-y-4">
                                    <div className="flex items-center gap-2 border-b pb-2 text-indigo-500">
                                        <Icon name="layout" size={14}/>
                                        <h3 className="text-[10px] font-black uppercase tracking-widest">Header Settings</h3>
                                    </div>
                                    <div className="grid gap-3">
                                        <div className="space-y-1">
                                            <span className="text-[8px] font-bold text-slate-400 uppercase tracking-widest">Top Label</span>
                                            <input value={tripSettings.topLabel} onChange={e => setTripSettings({...tripSettings, topLabel: e.target.value})} className="w-full bg-slate-50 rounded-xl p-3 text-xs font-bold border-none" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="space-y-1">
                                                <span className="text-[8px] font-bold text-slate-400 uppercase tracking-widest">Itinerary Tab</span>
                                                <input value={tripSettings.itineraryTitle} onChange={e => setTripSettings({...tripSettings, itineraryTitle: e.target.value})} className="w-full bg-slate-50 rounded-xl p-3 text-xs font-bold border-none uppercase" />
                                            </div>
                                            <div className="space-y-1">
                                                <span className="text-[8px] font-bold text-slate-400 uppercase tracking-widest">Checklist Tab</span>
                                                <input value={tripSettings.checklistTitle} onChange={e => setTripSettings({...tripSettings, checklistTitle: e.target.value})} className="w-full bg-slate-50 rounded-xl p-3 text-xs font-bold border-none uppercase" />
                                            </div>
                                        </div>
                                    </div>
                                </section>

                                <section className="space-y-6">
                                    <div className="flex items-center justify-between border-b pb-2 text-indigo-500">
                                        <div className="flex items-center gap-2">
                                            <Icon name="edit-3" size={14}/>
                                            <h3 className="text-[10px] font-black uppercase tracking-widest">Manage Data</h3>
                                        </div>
                                        <button onClick={addDay} className="text-[10px] font-black uppercase">+ Add Day</button>
                                    </div>
                                    {itinerary.map((day, dIdx) => (
                                        <div key={day.id} className="bg-white border rounded-3xl p-6 space-y-4 shadow-sm relative">
                                            <div className="flex gap-2">
                                                <input value={day.day} onChange={e => updateDay(dIdx, 'day', e.target.value)} className="w-20 bg-slate-50 p-2 rounded-lg text-xs font-black border-none uppercase"/>
                                                <input value={day.location} onChange={e => updateDay(dIdx, 'location', e.target.value)} className="flex-1 bg-slate-50 p-2 rounded-lg text-xs font-black border-none" placeholder="City Name"/>
                                            </div>
                                            <input value={day.date} onChange={e => updateDay(dIdx, 'date', e.target.value)} className="w-full text-base font-bold border-b p-1 border-slate-100" placeholder="YYYY/MM/DD (週)"/>
                                            
                                            <div className="space-y-4 pt-4">
                                                {day.items.map((item, iIdx) => (
                                                    <div key={item.id} className="p-4 bg-slate-50 rounded-2xl relative group space-y-3">
                                                        <div className="flex gap-2">
                                                            <input value={item.time} onChange={e => updateItem(dIdx, iIdx, 'time', e.target.value)} className="w-16 bg-white p-2 rounded-lg text-xs font-bold border border-slate-100"/>
                                                            <input value={item.title} onChange={e => updateItem(dIdx, iIdx, 'title', e.target.value)} className="flex-1 bg-white p-2 rounded-lg text-xs font-bold border border-slate-100" placeholder="Location Name (e.g. SoFi Stadium)"/>
                                                        </div>
                                                        <textarea value={item.desc} onChange={e => updateItem(dIdx, iIdx, 'desc', e.target.value)} className="w-full bg-white p-3 rounded-lg text-xs border border-slate-100 h-16 resize-none" placeholder="Notes..."/>
                                                        <div className="grid grid-cols-2 gap-2">
                                                            <div className="flex items-center gap-2 bg-white px-3 py-2 rounded-lg border border-slate-100">
                                                                <Icon name="car" size={12} className="text-slate-300"/>
                                                                <input type="number" value={item.distMi} onChange={e => updateItem(dIdx, iIdx, 'distMi', e.target.value)} className="w-full bg-transparent border-none p-0 focus:ring-0 text-xs font-bold" placeholder="Auto mi"/>
                                                            </div>
                                                            <div className="flex items-center gap-2 bg-white px-3 py-2 rounded-lg border border-slate-100">
                                                                <Icon name="clock" size={12} className="text-slate-300"/>
                                                                <input type="number" value={item.durationMin} onChange={e => updateItem(dIdx, iIdx, 'durationMin', e.target.value)} className="w-full bg-transparent border-none p-0 focus:ring-0 text-xs font-bold" placeholder="Auto min"/>
                                                            </div>
                                                        </div>
                                                        <button onClick={() => deleteItem(dIdx, iIdx)} className="absolute -top-2 -right-2 bg-white border rounded-full w-6 h-6 flex items-center justify-center text-rose-500 shadow-sm opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="x" size={12}/></button>
                                                    </div>
                                                ))}
                                                <button onClick={() => addItem(dIdx)} className="w-full py-4 border-2 border-dashed border-slate-100 rounded-2xl text-[10px] font-black text-slate-300 uppercase tracking-widest hover:text-indigo-500 hover:border-indigo-200 transition-all">+ Add Item</button>
                                            </div>
                                        </div>
                                    ))}
                                </section>
                            </div>
                        )}
                    </main>

                    {/* Nav Bar */}
                    <nav className="fixed bottom-10 left-1/2 -translate-x-1/2 bg-white/80 backdrop-blur-2xl shadow-2xl rounded-[2.5rem] flex items-center px-3 py-3 gap-1 z-50 border border-slate-100">
                        {[
                            { id: 'itinerary', icon: 'calendar', label: "行程" },
                            { id: 'packing', icon: 'briefcase', label: "清單" },
                            { id: 'tools', icon: 'calculator', label: "工具" },
                            { id: 'edit', icon: 'settings', label: "設定" },
                        ].map((tab) => (
                            <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-2 px-5 py-3 rounded-full transition-all duration-500 ${activeTab === tab.id ? 'bg-black text-white shadow-xl scale-105' : 'text-slate-300 hover:text-slate-600'}`}>
                                <Icon name={tab.icon} size={16} strokeWidth={activeTab === tab.id ? 2.5 : 2} />
                                {activeTab === tab.id && <span className="text-[10px] font-black tracking-tighter">{tab.label}</span>}
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
