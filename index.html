<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 美國行助手</title>
    
    <!-- PWA / App 圖示設定 -->
    <link rel="apple-touch-icon" href="icon.png?v=2">
    <link rel="icon" type="image/png" href="icon.png?v=2">
    
    <!-- 全螢幕 Web App 設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="2026 LA">
    <meta name="theme-color" content="#ffffff">
    
    <!-- 載入必要套件 (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // 將 SDK 賦值給 window 以便 Babel 腳本使用
        window.FirebaseSDK = { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, getFirestore, doc, setDoc, onSnapshot, collection };
        
        // 觸發自定義事件通知 SDK 已就緒
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        input, textarea { outline: none; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root">
        <!-- 初始加載畫面 -->
        <div class="flex flex-col items-center justify-center h-screen space-y-4">
            <div class="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">正在啟動雲端助手...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        function App() {
            // 從 window 獲取 SDK，避免賽跑問題
            const SDK = window.FirebaseSDK;
            const { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, getFirestore, doc, setDoc, onSnapshot } = SDK;

            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('itinerary');
            const [selectedDayIdx, setSelectedDayIdx] = useState(0);
            const [isSyncing, setIsSyncing] = useState(false);
            
            // 狀態定義
            const [tripSettings, setTripSettings] = useState({
                topLabel: "2026 LA TRIP",
                itineraryTitle: "journey.",
                checklistTitle: "checklist.",
                utilitiesTitle: "utilities.",
                editorTitle: "settings.",
                daysLeftLabel: "Days Left"
            });
            const [itinerary, setItinerary] = useState([]);
            const [packingList, setPackingList] = useState([]);
            const [usdAmount, setUsdAmount] = useState('1');
            const [twdRate, setTwdRate] = useState(32.5);
            const [weather, setWeather] = useState({ high: null, low: null, pop: null, status: 'loading' });
            const [newPackingText, setNewPackingText] = useState("");

            // --- Firebase 初始化 ---
            const firebaseConfig = useMemo(() => {
                try { return JSON.parse(__firebase_config); } catch(e) { return {}; }
            }, []);
            const app = useMemo(() => initializeApp(firebaseConfig), [firebaseConfig]);
            const auth = useMemo(() => getAuth(app), [app]);
            const db = useMemo(() => getFirestore(app), [app]);
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-trip';

            const Icon = ({ name, size = 16, strokeWidth = 2, className = "" }) => {
                useEffect(() => {
                    if (window.lucide) window.lucide.createIcons();
                }, [name]);
                return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
            };

            // API 輔助函式 (Google Maps 背景計算)
            async function fetchGoogleMapsData(prevTitle, currentTitle) {
                const apiKey = ""; 
                const systemPrompt = "你是一個導航專家。請提供 Google Maps 上這兩個地點的開車距離(mi)與時間(min)。僅回傳 JSON: {\"distMi\": 數字, \"durationMin\": 數字}";
                const userQuery = `從「${prevTitle}」到「${currentTitle}」`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            tools: [{ "google_search": {} }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    const result = await response.json();
                    return JSON.parse(result.candidates?.[0]?.content?.parts?.[0]?.text || "{}");
                } catch (error) {
                    return { distMi: 0, durationMin: 0 };
                }
            }

            // --- 認證流程 ---
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch(e) { console.error("Auth error", e); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, [auth]);

            // --- 雲端數據同步 ---
            useEffect(() => {
                if (!user) return;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tripStorage', 'mainData');
                const unsubscribe = onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.tripSettings) setTripSettings(data.tripSettings);
                        if (data.itinerary) setItinerary(data.itinerary);
                        if (data.packingList) setPackingList(data.packingList);
                        if (data.usdAmount) setUsdAmount(data.usdAmount);
                        if (data.twdRate) setTwdRate(data.twdRate);
                    }
                }, (error) => console.error("Firestore Error:", error));
                return () => unsubscribe();
            }, [user, db, appId]);

            const saveData = async (updates) => {
                if (!user) return;
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tripStorage', 'mainData');
                    await setDoc(docRef, {
                        tripSettings,
                        itinerary,
                        packingList,
                        usdAmount,
                        twdRate,
                        ...updates,
                        lastUpdated: Date.now()
                    }, { merge: true });
                } catch (e) { console.error("Cloud Save Failed:", e); }
            };

            const countdown = useMemo(() => {
                const target = new Date('2026-06-16T21:10:00').getTime();
                const diff = target - new Date().getTime();
                return Math.max(0, Math.floor(diff / (1000 * 60 * 60 * 24)));
            }, []);

            const dailyStats = useMemo(() => {
                const day = itinerary[selectedDayIdx];
                if (!day) return { dist: 0, time: 0 };
                return day.items.reduce((acc, item) => ({
                    dist: acc.dist + (Number(item.distMi) || 0),
                    time: acc.time + (Number(item.durationMin) || 0)
                }), { dist: 0, time: 0 });
            }, [selectedDayIdx, itinerary]);

            // --- 背景自動 Google Maps 同步 ---
            useEffect(() => {
                const timer = setTimeout(async () => {
                    if (!itinerary.length) return;
                    let changed = false;
                    const nextItin = JSON.parse(JSON.stringify(itinerary));

                    for (let dIdx = 0; dIdx < nextItin.length; dIdx++) {
                        const day = nextItin[dIdx];
                        for (let i = 1; i < day.items.length; i++) {
                            const item = day.items[i];
                            const prev = day.items[i-1];
                            const key = `${prev.title}-${item.title}`;
                            if (item.title && prev.title && item.lastGoogleKey !== key) {
                                setIsSyncing(true);
                                const data = await fetchGoogleMapsData(prev.title, item.title);
                                item.distMi = data.distMi;
                                item.durationMin = data.durationMin;
                                item.lastGoogleKey = key;
                                changed = true;
                            }
                        }
                    }
                    if (changed) {
                        setItinerary(nextItin);
                        saveData({ itinerary: nextItin });
                    }
                    setIsSyncing(false);
                }, 3000);
                return () => clearTimeout(timer);
            }, [itinerary]);

            // --- 天氣自動查詢 ---
            useEffect(() => {
                const fetchWeather = async () => {
                    const day = itinerary[selectedDayIdx];
                    if (!day?.location) return;
                    const tripDate = new Date(day.date.split(' ')[0].replace(/\//g, '-'));
                    if (isNaN(tripDate.getTime()) || (tripDate - new Date()) / 86400000 > 14) {
                        setWeather({ status: 'upcoming' }); return;
                    }
                    setWeather({ status: 'loading' });
                    try {
                        const geo = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(day.location)}&limit=1`).then(r => r.json());
                        if (geo[0]) {
                            const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${geo[0].lat}&longitude=${geo[0].lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`).then(r => r.json());
                            setWeather({ high: Math.round(w.daily.temperature_2m_max[0]), low: Math.round(w.daily.temperature_2m_min[0]), pop: `${w.daily.precipitation_probability_max[0]}%`, status: 'ready' });
                        }
                    } catch (e) { setWeather({ status: 'error' }); }
                };
                fetchWeather();
            }, [selectedDayIdx, itinerary]);

            // --- 互動方法 ---
            const updateDay = (idx, field, val) => {
                const next = [...itinerary];
                next[idx][field] = val;
                setItinerary(next);
                saveData({ itinerary: next });
            };
            const updateItem = (dIdx, iIdx, field, val) => {
                const next = [...itinerary];
                next[dIdx].items[iIdx][field] = val;
                setItinerary(next);
                saveData({ itinerary: next });
            };
            const addItem = (dIdx) => {
                const next = [...itinerary];
                next[dIdx].items.push({ id: Date.now(), time: "12:00", title: "", desc: "", distMi: 0, durationMin: 0 });
                setItinerary(next);
                saveData({ itinerary: next });
            };
            const deleteItem = (dIdx, iIdx) => {
                const next = [...itinerary];
                next[dIdx].items.splice(iIdx, 1);
                setItinerary(next);
                saveData({ itinerary: next });
            };
            const addDay = () => {
                const next = [...itinerary, { id: Date.now(), day: `Day ${itinerary.length + 1}`, date: "2026/06/--", location: "Los Angeles", items: [] }];
                setItinerary(next);
                saveData({ itinerary: next });
            };
            const togglePacking = (id) => {
                const next = packingList.map(item => item.id === id ? { ...item, checked: !item.checked } : item);
                setPackingList(next);
                saveData({ packingList: next });
            };
            const addPackingItem = (e) => {
                e.preventDefault(); if (!newPackingText.trim()) return;
                const next = [...packingList, { id: Date.now(), text: newPackingText, checked: false }];
                setPackingList(next);
                setNewPackingText("");
                saveData({ packingList: next });
            };
            const deletePackingItem = (id) => {
                const next = packingList.filter(item => item.id !== id);
                setPackingList(next);
                saveData({ packingList: next });
            };

            if (!user) {
                return (
                    <div className="flex flex-col items-center justify-center h-screen space-y-4">
                        <div className="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                        <p className="text-[10px] font-black uppercase tracking-widest text-slate-400">正在連接雲端數據...</p>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-screen max-w-md mx-auto bg-white shadow-2xl overflow-hidden relative text-black">
                    {/* Header */}
                    <header className="px-8 pt-10 pb-6 z-10 bg-white border-b border-slate-50">
                        <div className="flex justify-between items-start mb-2">
                            <p className="text-[9px] font-black tracking-[0.3em] text-slate-300 uppercase leading-none">{tripSettings.topLabel}</p>
                            <div className="flex items-center gap-1.5 px-2 py-0.5 bg-indigo-50 rounded-full border border-indigo-100">
                                <div className={`w-1.5 h-1.5 rounded-full ${isSyncing ? 'bg-amber-400 animate-pulse' : 'bg-emerald-500'}`}></div>
                                <span className="text-[8px] font-black text-slate-500 uppercase tracking-tighter">{isSyncing ? 'Syncing...' : 'Cloud Active'}</span>
                            </div>
                        </div>
                        <div className="flex justify-between items-end">
                            <h1 className="text-3xl font-black tracking-tighter text-black leading-none lowercase">
                                {activeTab === 'itinerary' && tripSettings.itineraryTitle}
                                {activeTab === 'packing' && tripSettings.checklistTitle}
                                {activeTab === 'tools' && tripSettings.utilitiesTitle}
                                {activeTab === 'edit' && tripSettings.editorTitle}
                            </h1>
                            <div className="text-right">
                                <p className="text-2xl font-black tracking-tighter text-black leading-none">{countdown}</p>
                                <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">{tripSettings.daysLeftLabel}</p>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 overflow-y-auto no-scrollbar pb-36 px-8">
                        {activeTab === 'itinerary' && (
                            <div className="space-y-6 animate-fade-in pt-6">
                                <div className="flex space-x-2 overflow-x-auto py-1 no-scrollbar">
                                    {itinerary.map((day, idx) => (
                                        <button key={day.id} onClick={() => setSelectedDayIdx(idx)} className={`flex-shrink-0 px-4 py-2 rounded-xl transition-all border ${selectedDayIdx === idx ? 'bg-black border-black text-white shadow-lg' : 'bg-white border-slate-100 text-slate-400'}`}>
                                            <p className="text-[8px] font-black uppercase tracking-widest mb-0.5">{day.day}</p>
                                            <p className="text-xs font-bold">{day.date.split('/')[2]?.split(' ')[0] || '--'}</p>
                                        </button>
                                    ))}
                                </div>

                                <div className="bg-slate-50 rounded-2xl px-6 py-4 border border-slate-100 flex items-center justify-between min-h-[72px]">
                                    <div className="flex items-center gap-6">
                                        <div className="flex items-center gap-2">
                                            <Icon name="map-pin" size={12} className="text-slate-300" />
                                            <span className="text-[10px] font-black uppercase tracking-widest text-slate-400">{itinerary[selectedDayIdx]?.location || '--'}</span>
                                        </div>
                                        {weather.status === 'upcoming' ? (
                                            <span className="text-xs font-bold text-slate-300 italic lowercase">尚未公佈預報</span>
                                        ) : weather.status === 'ready' ? (
                                            <div className="flex items-center gap-5">
                                                <div className="flex items-baseline gap-1">
                                                    <span className="text-lg font-black tracking-tighter">{weather.high}°</span>
                                                    <span className="text-[10px] font-bold text-slate-300">/</span>
                                                    <span className="text-sm font-bold text-slate-400 tracking-tighter">{weather.low}°</span>
                                                </div>
                                                <div className="flex items-center gap-1.5">
                                                    <Icon name="droplets" size={11} className="text-blue-400" />
                                                    <span className="text-xs font-black text-blue-500 tracking-tighter">{weather.pop}</span>
                                                </div>
                                            </div>
                                        ) : <div className="w-20 h-4 bg-slate-200 animate-pulse rounded"></div>}
                                    </div>
                                    {weather.status === 'ready' && <Icon name={parseInt(weather.pop) > 30 ? 'cloud-rain' : 'sun'} size={22} className={parseInt(weather.pop) > 30 ? 'text-blue-400' : 'text-amber-400'} />}
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <div className="bg-slate-50 rounded-2xl p-4 border border-slate-100"><div className="flex items-center gap-2 mb-1"><Icon name="clock" size={12} className="text-indigo-400" /><span className="text-[9px] font-black text-slate-400 uppercase tracking-widest">總車程</span></div><p className="text-lg font-black tracking-tighter">{dailyStats.time >= 60 ? `${Math.floor(dailyStats.time / 60)}h ${dailyStats.time % 60}m` : `${dailyStats.time}m`}</p></div>
                                    <div className="bg-slate-50 rounded-2xl p-4 border border-slate-100"><div className="flex items-center gap-2 mb-1"><Icon name="navigation" size={12} className="text-emerald-400" /><span className="text-[9px] font-black text-slate-400 uppercase tracking-widest">總距離</span></div><p className="text-lg font-black tracking-tighter">{dailyStats.dist} mi</p></div>
                                </div>

                                <div className="space-y-10 pt-4 border-t border-slate-50">
                                    {itinerary[selectedDayIdx]?.items.length === 0 && <p className="text-center text-slate-300 text-[10px] py-10 font-bold uppercase tracking-widest">尚無行程，請至設定頁面新增。</p>}
                                    {itinerary[selectedDayIdx]?.items.map((item, idx) => (
                                        <div key={item.id} className="relative group animate-fade-in"><div className="flex items-start gap-5"><div className="pt-1 min-w-[45px]"><span className="text-[8px] font-black text-slate-200 uppercase block mb-1">Time</span><span className="text-xs font-bold text-black">{item.time}</span></div><div className="flex-1"><div className="flex items-center gap-2 mb-2">{item.distMi > 0 && <span className="text-[9px] font-bold text-slate-300 flex items-center gap-1"><Icon name="car" size={10} /> +{item.distMi} mi ({item.durationMin}m)</span>}</div><h4 className="text-lg font-extrabold tracking-tight mb-1 text-black leading-tight">{item.title || "未設定地點"}</h4><p className="text-xs text-slate-500 font-medium leading-relaxed mb-4">{item.desc}</p></div></div></div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'packing' && (
                            <div className="space-y-6 animate-fade-in pt-6">
                                <div className="p-8 bg-black rounded-[2.5rem] text-white flex justify-between items-center shadow-2xl">
                                    <div><p className="text-[9px] font-black uppercase tracking-widest text-slate-500 mb-1 uppercase">Progress</p><h3 className="text-2xl font-bold tracking-tighter italic lowercase">{tripSettings.checklistTitle}</h3></div><div className="text-3xl font-black italic">{packingList.length ? Math.round((packingList.filter(i => i.checked).length / packingList.length) * 100) : 0}%</div>
                                </div>
                                <div className="space-y-3">
                                    {packingList.map(item => (
                                        <div key={item.id} className="group relative flex items-center gap-4">
                                            <button onClick={() => togglePacking(item.id)} className={`flex-1 flex items-center gap-5 p-5 rounded-[1.5rem] border transition-all ${item.checked ? 'bg-slate-50 border-transparent opacity-60' : 'bg-white border-slate-100 shadow-sm'}`}>
                                                <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all ${item.checked ? 'bg-emerald-500 border-emerald-500 text-white shadow-lg' : 'border-slate-200'}`}>{item.checked && <Icon name="check" size={12} strokeWidth={4} />}</div>
                                                <span className={`text-sm font-bold text-left flex-1 ${item.checked ? 'text-slate-300 line-through' : 'text-slate-900'}`}>{item.text}</span>
                                            </button>
                                            <button onClick={() => deletePackingItem(item.id)} className="p-3 text-slate-200 hover:text-rose-500 transition-colors"><Icon name="trash-2" size={16} /></button>
                                        </div>
                                    ))}
                                </div>
                                <form onSubmit={addPackingItem} className="mt-8 flex gap-2 p-1 bg-white border border-slate-100 rounded-2xl shadow-sm focus-within:border-indigo-200 transition-colors">
                                    <input type="text" value={newPackingText} onChange={(e) => setNewPackingText(e.target.value)} placeholder="Add to list..." className="flex-1 px-5 py-3 text-sm font-medium placeholder:text-slate-300"/>
                                    <button type="submit" className="w-11 h-11 bg-black text-white rounded-xl flex items-center justify-center hover:bg-slate-800 active:scale-95"><Icon name="plus" size={18} /></button>
                                </form>
                            </div>
                        )}

                        {activeTab === 'tools' && (
                            <div className="space-y-8 animate-fade-in pt-6">
                                <div className="bg-slate-50 rounded-[2.5rem] p-10 space-y-10 border border-slate-100">
                                    <div className="space-y-4">
                                        <div><p className="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4 lowercase">{tripSettings.utilitiesTitle}</p><div className="flex items-baseline gap-3"><span className="text-2xl font-black text-slate-300">$</span><input type="number" value={usdAmount} onChange={e => {setUsdAmount(e.target.value); saveData({ usdAmount: e.target.value })}} className="w-full bg-transparent border-none text-6xl font-black tracking-tighter focus:ring-0 p-0 text-black outline-none" /></div></div>
                                        <div className="flex items-center gap-4 py-2 border-y border-slate-100/50">
                                            <span className="text-[9px] font-black text-slate-300 uppercase tracking-widest">Rate</span>
                                            <input type="number" step="0.1" value={twdRate} onChange={e => {setTwdRate(e.target.value); saveData({ twdRate: e.target.value })}} className="bg-transparent text-xs font-bold text-slate-400 w-16" />
                                            <div className="h-4 w-[1px] bg-slate-100"></div>
                                            <span className="text-[8px] font-bold text-slate-200 uppercase">Live from cloud</span>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-4 opacity-20"><div className="h-[1px] flex-1 bg-slate-900"></div><Icon name="chevron-down" /><div className="h-[1px] flex-1 bg-slate-900"></div></div>
                                    <div className="text-right"><p className="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">TWD Estimate</p><span className="text-2xl font-black text-slate-200 mr-3">NT$</span><span className="text-6xl font-black tracking-tighter text-black">{(Number(usdAmount) * Number(twdRate)).toLocaleString(undefined, {maximumFractionDigits: 0})}</span></div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'edit' && (
                            <div className="space-y-10 animate-fade-in pt-6 pb-10">
                                <section className="space-y-6">
                                    <div className="flex items-center justify-between border-b pb-2 text-indigo-500">
                                        <div className="flex items-center gap-2">
                                            <Icon name="edit-3" size={14}/>
                                            <h3 className="text-[10px] font-black uppercase tracking-widest lowercase">Manage Journey</h3>
                                        </div>
                                        <button onClick={addDay} className="text-[10px] font-black uppercase text-indigo-600">+ Add Day</button>
                                    </div>
                                    {itinerary.map((day, dIdx) => (
                                        <div key={day.id} className="bg-white border border-slate-100 rounded-3xl p-6 space-y-4 shadow-sm relative text-black">
                                            <div className="flex gap-2">
                                                <input value={day.day} onChange={e => updateDay(dIdx, 'day', e.target.value)} className="w-20 bg-slate-50 p-2 rounded-lg text-xs font-black border-none uppercase"/>
                                                <input value={day.location} onChange={e => updateDay(dIdx, 'location', e.target.value)} className="flex-1 bg-slate-50 p-2 rounded-lg text-xs font-black border-none" placeholder="City Name"/>
                                            </div>
                                            <input value={day.date} onChange={e => updateDay(dIdx, 'date', e.target.value)} className="w-full text-base font-bold border-b p-1 border-slate-100" placeholder="YYYY/MM/DD (週)"/>
                                            
                                            <div className="space-y-4 pt-4 border-t border-slate-50">
                                                {day.items.map((item, iIdx) => (
                                                    <div key={item.id} className="p-4 bg-slate-50 rounded-2xl relative group space-y-3">
                                                        <div className="flex gap-2">
                                                            <input value={item.time} onChange={e => updateItem(dIdx, iIdx, 'time', e.target.value)} className="w-16 bg-white p-2 rounded-lg text-xs font-bold border border-slate-100"/>
                                                            <div className="flex-1 relative flex items-center">
                                                                <input value={item.title} onChange={e => updateItem(dIdx, iIdx, 'title', e.target.value)} className="w-full bg-white p-2 rounded-lg text-xs font-bold border border-slate-100 pr-8" placeholder="Location Name"/>
                                                                <button onClick={() => window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.title || day.location)}`)} className="absolute right-2 text-slate-300 hover:text-indigo-500"><Icon name="map" size={12}/></button>
                                                            </div>
                                                        </div>
                                                        <textarea value={item.desc} onChange={e => updateItem(dIdx, iIdx, 'desc', e.target.value)} className="w-full bg-white p-3 rounded-lg text-xs border border-slate-100 h-16 resize-none" placeholder="Description..."/>
                                                        <div className="grid grid-cols-2 gap-2 text-slate-400 opacity-60">
                                                            <div className="flex items-center gap-2 bg-white px-3 py-2 rounded-lg border border-slate-100"><Icon name="car" size={10}/><span className="text-[10px] font-bold">{item.distMi || 0} mi</span></div>
                                                            <div className="flex items-center gap-2 bg-white px-3 py-2 rounded-lg border border-slate-100"><Icon name="clock" size={10}/><span className="text-[10px] font-bold">{item.durationMin || 0} min</span></div>
                                                        </div>
                                                        <button onClick={() => deleteItem(dIdx, iIdx)} className="absolute -top-2 -right-2 bg-white border border-slate-100 rounded-full w-6 h-6 flex items-center justify-center text-rose-500 shadow-sm opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="x" size={12}/></button>
                                                    </div>
                                                ))}
                                                <button onClick={() => addItem(dIdx)} className="w-full py-4 border-2 border-dashed border-slate-100 rounded-2xl text-[10px] font-black text-slate-300 uppercase tracking-widest hover:text-indigo-500 hover:border-indigo-200 transition-all">+ Add Item</button>
                                            </div>
                                        </div>
                                    ))}
                                </section>
                            </div>
                        )}
                    </main>

                    {/* Nav Bar */}
                    <nav className="fixed bottom-10 left-1/2 -translate-x-1/2 bg-white/80 backdrop-blur-2xl shadow-2xl rounded-[2.5rem] flex items-center px-3 py-3 gap-1 z-50 border border-slate-100">
                        {[
                            { id: 'itinerary', icon: 'calendar', label: "行程" },
                            { id: 'packing', icon: 'briefcase', label: "清單" },
                            { id: 'tools', icon: 'calculator', label: "工具" },
                            { id: 'edit', icon: 'settings', label: "設定" },
                        ].map((tab) => (
                            <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-2 px-5 py-3 rounded-full transition-all duration-500 ${activeTab === tab.id ? 'bg-black text-white shadow-xl scale-105' : 'text-slate-300 hover:text-slate-600'}`}>
                                <Icon name={tab.icon} size={16} strokeWidth={activeTab === tab.id ? 2.5 : 2} />
                                {activeTab === tab.id && <span className="text-[10px] font-black tracking-tighter">{tab.label}</span>}
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        // 封裝渲染邏輯，等待 Firebase 就緒
        function startApp() {
            if (!window.FirebaseSDK) return;
            const rootElement = document.getElementById('root');
            const root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
        }

        // 監聽 SDK 就緒事件或立即啟動
        if (window.FirebaseSDK) {
            startApp();
        } else {
            window.addEventListener('firebase-ready', startApp);
        }
    </script>
</body>
</html>
